name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    # Initial MiKode CI release, validated on main after merge.
    uses: Mikode13/.github/.github/workflows/ci.yml@78523ec52c5a598be22e8682cee47409bbe9b4a5
    with:
      profile: docs
